name: Deploy Mermaid Native documentation and Web preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build documentation site
        working-directory: docs-site
        run: |
          npm ci
          DOCS_BASE=/mermaid-native/ npm run docs:build
      - name: Build production Wasm/JS acceptance app
        run: ./gradlew :mermaid-web:wasmJsBrowserProductionWebpack
      - name: Assemble Pages preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/playground
          cp -R docs-site/.vitepress/dist/. _site/
          cp acceptance/index.html acceptance/consumer.css acceptance/consumer.js _site/playground/
          cp mermaid-web/build/kotlin-webpack/wasmJs/productionExecutable/mermaid-web.js _site/playground/
          cp mermaid-web/build/kotlin-webpack/wasmJs/productionExecutable/*.wasm _site/playground/
          printf '%s\n' "${GITHUB_SHA}" > _site/SOURCE_SHA
          printf '%s\n' "non-production-preview" > _site/RELEASE_CLASS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
