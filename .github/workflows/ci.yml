name: Mermaid Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kmp:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile publishable common metadata
        run: ./gradlew compileCommonMainKotlinMetadata
      - name: TEMP early production Wasm bundle
        continue-on-error: true
        run: ./gradlew :mermaid-web:wasmJsBrowserDistribution
      - name: TEMP upload early Wasm bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-web-wasm-early
          path: mermaid-web/build/dist/wasmJs/productionExecutable/
      - name: TEMP regenerate sample goldens
        continue-on-error: true
        run: UPDATE_MERMAID_GOLDENS=true ./gradlew :mermaid-testkit:testDebugUnitTest --tests '*CheckedInSamplesTest*'
      - name: TEMP upload sample goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-goldens
          path: samples/
      - run: ./gradlew check :mermaid-core:allTests :mermaid-layout-simple:allTests :mermaid-testkit:allTests :mermaid-web:allTests :mermaid-kuikly:allTests :mermaid-compose:jvmTest cyclonedxBom
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify optimized production Wasm Usecase semantics
        run: |
          ./gradlew :mermaid-web:wasmJsBrowserDistribution
          node scripts/verify-usecase-production-wasm.mjs
      - name: Upload production Wasm web bundle
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-web-wasm
          path: mermaid-web/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
      - run: ./scripts/verify-web-consumer-mutation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-native-sbom
          path: build/reports/cyclonedx-direct/bom.*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify imported upstream assertion sources
        run: python3 compatibility/upstream-batch/run.py --verify-only --output build/upstream-batch
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build VitePress documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run docs:build
