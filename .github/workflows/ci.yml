name: Mermaid Native CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kmp:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyThirdPartyNotices cyclonedxBom compileDebugKotlinAndroid compileKotlinIosSimulatorArm64
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-native-sbom
          path: build/reports/cyclonedx-direct/bom.*
