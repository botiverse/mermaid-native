name: Mermaid Native CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kmp:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check :mermaid-core:allTests :mermaid-layout-simple:allTests :mermaid-testkit:allTests :mermaid-web:allTests :mermaid-kuikly:allTests cyclonedxBom
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify optimized production Wasm Usecase semantics
        run: |
          ./gradlew :mermaid-web:wasmJsBrowserDistribution
          node scripts/verify-usecase-production-wasm.mjs
      - run: ./scripts/verify-web-consumer-mutation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-native-sbom
          path: build/reports/cyclonedx-direct/bom.*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify imported upstream assertion sources
        run: python3 compatibility/upstream-batch/run.py --verify-only --output build/upstream-batch
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build VitePress documentation
        working-directory: docs-site
        run: |
          npm ci
          npm run docs:build
