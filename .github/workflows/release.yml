name: Publish Maven artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-14
    environment: raft-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and publish
        shell: bash
        env:
          MERMAID_MAVEN_URL: ${{ secrets.MERMAID_MAVEN_URL }}
          MERMAID_MAVEN_USER: ${{ secrets.MERMAID_MAVEN_USER }}
          MERMAID_MAVEN_TOKEN: ${{ secrets.MERMAID_MAVEN_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew -Pversion="$version" verifyThirdPartyNotices cyclonedxBom publishAllPublicationsToMermaidRegistryRepository
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-native-sbom
          path: build/reports/cyclonedx-direct/bom.*
