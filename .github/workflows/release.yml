name: Publish Maven artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and publish
        shell: bash
        env:
          MERMAID_MAVEN_USER: ${{ github.actor }}
          MERMAID_MAVEN_TOKEN: ${{ github.token }}
          MERMAID_SIGNING_KEY: ${{ secrets.MERMAID_SIGNING_KEY }}
          MERMAID_SIGNING_PASSWORD: ${{ secrets.MERMAID_SIGNING_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew -Pversion="$version" verifyProjectLicensing verifyThirdPartyNotices cyclonedxBom publishAllPublicationsToMermaidRegistryRepository
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-native-sbom
          path: build/reports/cyclonedx-direct/bom.*
