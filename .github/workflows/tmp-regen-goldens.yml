# TEMPORARY (PR #201): regenerate SVG goldens on CI, removed before merge.
name: tmp regen goldens
on:
  pull_request:
jobs:
  regen:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :mermaid-testkit:allTests --continue || true
        env:
          UPDATE_MERMAID_GOLDENS: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: samples/*.svg
      - run: ./gradlew :mermaid-testkit:testDebugUnitTest --tests '*TmpNotePreviewTest*' --rerun-tasks || true
        env:
          NOTE_PREVIEW_DIR: ${{ github.workspace }}/note-preview
      - uses: actions/upload-artifact@v4
        with:
          name: note-preview
          path: note-preview/
