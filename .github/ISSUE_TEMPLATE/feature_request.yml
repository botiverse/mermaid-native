name: Feature request
description: Propose a bounded compatibility, rendering, or infrastructure increment
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed scope
      description: Describe one narrow user problem and the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility contract
      description: State accepted syntax/API, unsupported cases, diagnostics, and matrix impact.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Test plan
      description: Include positive, negative, differential, and platform tests as applicable.
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: License and security impact
      description: Note new dependencies, notices, untrusted-input boundaries, and artifact impact.
    validations:
      required: true

